<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 字幕翻译器</title>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d3a;
            --text: #e4e4e7;
            --muted: #71717a;
            --accent: #3b82f6;
            --error: #ef4444;
        }
        [data-theme="light"] {
            --bg: #f5f5f5;
            --card: #ffffff;
            --border: #e4e4e7;
            --text: #1a1a2e;
            --muted: #71717a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.3s, color 0.3s;
        }
        .login-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 16px; padding: 40px; width: 360px; max-width: 90vw;
        }
        .login-card h1 { font-size: 22px; text-align: center; margin-bottom: 8px; }
        .login-card .subtitle { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 28px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        input[type="text"], input[type="password"] {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 12px 14px; border-radius: 8px; width: 100%; font-size: 15px;
        }
        input:focus { outline: none; border-color: var(--accent); }
        .btn {
            background: var(--accent); color: white; border: none;
            padding: 12px; border-radius: 8px; width: 100%;
            font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
        .btn:hover { background: #2563eb; }
        .error-msg { color: var(--error); font-size: 13px; text-align: center; margin-bottom: 16px; }
        .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 24px; }
        .footer a { color: var(--accent); text-decoration: none; }
        .header-right { display: flex; justify-content: flex-end; margin-bottom: 16px; }
        .theme-btn {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            width: 32px; height: 32px; border-radius: 6px; cursor: pointer; font-size: 16px;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="header-right">
        <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
    <h1>🎬 字幕翻译器</h1>
    <p class="subtitle">请登录后使用</p>
    {% if error %}
    <p class="error-msg">{{ error }}</p>
    {% endif %}
    <form method="POST" action="/login">
        <div class="form-group">
            <label>用户名</label>
            <input type="text" name="username" autofocus required>
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn">登录</button>
    </form>
    <div class="footer">
        <p>ywsj-sub-translator · <a href="https://github.com/yyzq-cf/ywsj-sub-translator" target="_blank">GitHub</a></p>
    </div>
</div>
<script>
function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    if (current === 'light') {
        document.documentElement.removeAttribute('data-theme');
        document.getElementById('themeBtn').textContent = '🌙';
        localStorage.setItem('theme', 'dark');
    } else {
        document.documentElement.setAttribute('data-theme', 'light');
        document.getElementById('themeBtn').textContent = '☀️';
        localStorage.setItem('theme', 'light');
    }
}
var savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeBtn').textContent = '☀️';
}
</script>
</body>
</html>

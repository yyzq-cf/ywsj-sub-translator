<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM配置 - 字幕翻译器</title>
    <style>
        :root {
            --bg: #0f1117; --card: #1a1d27; --border: #2a2d3a;
            --text: #e4e4e7; --muted: #71717a; --accent: #3b82f6;
            --accent-hover: #2563eb; --success: #22c55e; --error: #ef4444;
        }
        [data-theme="light"] {
            --bg: #f5f5f5; --card: #ffffff; --border: #e4e4e7;
            --text: #1a1a2e; --muted: #71717a;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
        }
        .container { max-width: 720px; margin: 0 auto; padding: 20px; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 0; border-bottom: 1px solid var(--border); margin-bottom: 30px;
        }
        .nav-bar { display: flex; align-items: center; gap: 16px; }
        .nav-bar h1 { font-size: 22px; margin-right: 12px; }
        .nav-btn {
            padding: 8px 16px; border-radius: 8px; font-size: 14px;
            text-decoration: none; color: var(--muted); border: 1px solid transparent;
            transition: all 0.2s;
        }
        .nav-btn:hover { color: var(--text); border-color: var(--border); }
        .nav-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(59,130,246,0.1); }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .version-badge { color: var(--muted); font-size: 13px; }
        .theme-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 8px; cursor: pointer; font-size: 18px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; }
        .card-title { font-size: 15px; color: var(--muted); margin-bottom: 16px; }
        select, input[type="text"], input[type="password"] {
            background: var(--bg); border: 1px solid var(--border); color: var(--text);
            padding: 10px 12px; border-radius: 8px; width: 100%; font-size: 14px;
        }
        select:focus, input:focus { outline: none; border-color: var(--accent); }
        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-group { flex: 1; }
        .form-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
        .btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
        .btn:hover { background: var(--accent-hover); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .btn-sm { padding: 6px 12px; font-size: 12px; border-radius: 6px; }
        .btn-row { display: flex; gap: 12px; margin-top: 8px; }
        .config-item { display: flex; justify-content: space-between; align-items: center; padding: 14px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; }
        .config-info { flex: 1; }
        .config-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .config-meta { font-size: 12px; color: var(--muted); }
        .config-actions { display: flex; gap: 6px; }
        .empty-state { text-align: center; color: var(--muted); padding: 30px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
        .toast.show { opacity: 1; }
        .toast.error { background: var(--error); color: white; }
        .toast.success { background: var(--success); color: white; }
        .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px 0; }
        a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <div class="nav-bar">
            <h1>🎬 字幕翻译器</h1>
            <a href="/" class="nav-btn">翻译</a>
            <a href="/settings" class="nav-btn active">⚙️ LLM配置</a>
        </div>
        <div class="header-right">
            <span class="version-badge">{{ version }}</span>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
        </div>
    </header>

    <!-- System Cleanup -->
    <div class="card">
        <div class="card-title">🧹 系统清理</div>
        <div class="config-item">
            <div class="config-info">
                <div class="config-name">翻译任务缓存</div>
                <div class="config-meta">清理内存中的翻译任务数据，释放服务器内存</div>
            </div>
            <div class="config-actions">
                <button class="btn btn-secondary btn-sm" onclick="cleanupCache()">🧹 清理缓存</button>
            </div>
        </div>
        <div class="config-item">
            <div class="config-info">
                <div class="config-name">Docker 旧镜像</div>
                <div class="config-meta">清理未使用的 Docker 镜像和构建缓存</div>
            </div>
            <div class="config-actions">
                <button class="btn btn-secondary btn-sm" onclick="cleanupDocker()">🗑️ 清理镜像</button>
            </div>
        </div>
    </div>

    <!-- Config List -->
    <div class="card">
        <div class="card-title">🤖 已配置的 LLM 模型</div>
        <div id="configList"></div>
        <div class="btn-row">
            <button class="btn btn-secondary btn-sm" onclick="showAddForm()">➕ 添加新配置</button>
        </div>
    </div>

    <!-- Add/Edit Form -->
    <div class="card" id="addForm" style="display:none;">
        <div class="card-title" id="formTitle">添加新配置</div>
        <div class="form-row">
            <div class="form-group">
                <label>选择提供商（自动填充地址和模型）</label>
                <select id="cfgPreset" onchange="onPresetChange()">
                    <option value="">— 自定义 —</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>备注名称 *</label>
                <input type="text" id="cfgName" placeholder="如：我的GPT-4o / DeepSeek / 本地Qwen">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>API Base URL *</label>
                <input type="text" id="cfgBaseUrl" placeholder="https://api.openai.com">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>API Key <a id="apiKeyLink" href="#" target="_blank" style="font-size:12px; display:none;">获取 API Key →</a></label>
                <input type="password" id="cfgApiKey" placeholder="sk-...">
            </div>
            <div class="form-group">
                <label>模型名称 * <button type="button" class="btn btn-secondary btn-sm" onclick="fetchModels()" style="display:inline; padding:2px 8px; font-size:11px;">📡 获取模型列表</button></label>
                <div id="modelInputWrap">
                    <input type="text" id="cfgModel" placeholder="gpt-4o-mini">
                </div>
                <select id="cfgModelSelect" style="display:none; margin-top:4px;" onchange="document.getElementById('cfgModel').value=this.value"></select>
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-secondary btn-sm" onclick="hideAddForm()">取消</button>
            <button class="btn btn-secondary btn-sm" onclick="testConfig()">🔌 测试连接</button>
            <button class="btn btn-sm" onclick="saveConfig()" id="saveBtn">💾 保存</button>
        </div>
    </div>

    <!-- Translate API Config -->
    <div class="card">
        <div class="card-title">🌐 翻译API配置（腾讯/百度/有道）</div>
        <div id="tapiConfigList"></div>
        <div class="btn-row">
            <button class="btn btn-secondary btn-sm" onclick="showTapiAddForm()">➕ 添加翻译API</button>
        </div>
    </div>

    <!-- Translate API Add/Edit Form -->
    <div class="card" id="tapiAddForm" style="display:none;">
        <div class="card-title" id="tapiFormTitle">添加翻译API</div>
        <div class="form-row">
            <div class="form-group">
                <label>选择服务商</label>
                <select id="tapiPreset" onchange="onTapiPresetChange()">
    var keyLabels = document.querySelectorAll('#tapiAddForm .form-group label');
    if (keyLabels.length >= 2) {
        keyLabels[0].innerHTML = p.key_name + ' <a id="tapiKeyLink" href="' + (p.key_url || '#') + '" target="_blank" style="font-size:12px;' + (p.key_url ? '' : 'display:none;') + '">获取 Key →</a>';
        keyLabels[1].textContent = p.secret_name;
    }
                    <option value="">— 选择 —</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>备注名称 *</label>
                <input type="text" id="tapiName" placeholder="如：我的腾讯翻译">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>API Key / ID <a id="tapiKeyLink" href="#" target="_blank" style="font-size:12px; display:none;">获取 →</a></label>
                <input type="text" id="tapiKey" placeholder="APP ID / SecretId">
            </div>
            <div class="form-group">
                <label>Secret Key / 密钥</label>
                <input type="password" id="tapiSecret" placeholder="密钥">
            </div>
        </div>
        <div class="btn-row">
            <button class="btn btn-secondary btn-sm" onclick="hideTapiAddForm()">取消</button>
            <button class="btn btn-secondary btn-sm" onclick="testTapiConfig()">🔌 测试</button>
            <button class="btn btn-sm" onclick="saveTapiConfig()" id="tapiSaveBtn">💾 保存</button>
        </div>
    </div>

    <div class="footer">
        <p>ywsj-sub-translator · <a href="https://github.com/yyzq-cf/ywsj-sub-translator" target="_blank">GitHub</a></p>
    </div>
</div>
<div class="toast" id="toast"></div>

<script>
function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast show ' + (type || '');
    setTimeout(function() { t.classList.remove('show'); }, 3000);
}

var editingId = null;

// Load presets into dropdown
function loadPresets() {
    fetch('/api/llm-presets').then(function(r){return r.json();}).then(function(presets){
        var sel = document.getElementById('cfgPreset');
        presets.forEach(function(p) {
            var opt = document.createElement('option');
            opt.value = JSON.stringify(p);
            opt.textContent = p.name;
            sel.appendChild(opt);
        });
    });
}

function onPresetChange() {
    var sel = document.getElementById('cfgPreset');
    if (!sel.value) return;
    var p = JSON.parse(sel.value);
    document.getElementById('cfgName').value = p.name;
    document.getElementById('cfgBaseUrl').value = p.base_url;
    document.getElementById('cfgModel').value = p.model;
    var keyLink = document.getElementById('apiKeyLink');
    if (p.key_url) {
        keyLink.href = p.key_url;
        keyLink.style.display = 'inline';
        keyLink.textContent = '获取 API Key →';
    } else {
        keyLink.style.display = 'none';
    }
}

function loadConfigs() {
    fetch('/api/llm-configs').then(function(r){return r.json();}).then(function(configs){
        var list = document.getElementById('configList');
        list.innerHTML = '';
        if (configs.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无配置，点击下方按钮添加</div>';
            return;
        }
        configs.forEach(function(c) {
            var div = document.createElement('div');
            div.className = 'config-item';
            var keyInfo = c.has_key ? ('密钥: ' + c.api_key_masked) : '未设置密钥';
            div.innerHTML =
                '<div class="config-info">' +
                    '<div class="config-name">' + esc(c.name) + '</div>' +
                    '<div class="config-meta">' + esc(c.base_url) + ' · ' + esc(c.model) + ' · ' + keyInfo + '</div>' +
                '</div>' +
                '<div class="config-actions">' +
                    '<button class="btn btn-secondary btn-sm" onclick="testConfigById(\'' + c.id + '\')">🔌测试</button>' +
                    '<button class="btn btn-secondary btn-sm" onclick="editConfig(\'' + c.id + '\',\'' + esc(c.name) + '\',\'' + esc(c.base_url) + '\',\'' + esc(c.model) + '\')">✏️编辑</button>' +
                    '<button class="btn btn-secondary btn-sm" onclick="deleteConfig(\'' + c.id + '\',\'' + esc(c.name) + '\')" style="color:var(--error);">🗑️删除</button>' +
                '</div>';
            list.appendChild(div);
        });
    });
}

function showAddForm() {
    editingId = null;
    document.getElementById('formTitle').textContent = '添加新配置';
    document.getElementById('cfgPreset').value = '';
    document.getElementById('cfgName').value = '';
    document.getElementById('cfgBaseUrl').value = '';
    document.getElementById('cfgApiKey').value = '';
    document.getElementById('cfgModel').value = '';
    document.getElementById('saveBtn').textContent = '💾 保存';
    document.getElementById('addForm').style.display = 'block';
    document.getElementById('cfgName').focus();
}

function hideAddForm() {
    document.getElementById('addForm').style.display = 'none';
    editingId = null;
}

function editConfig(id) {
    fetch('/api/llm-configs/' + id + '/full').then(function(r){return r.json();}).then(function(cfg){
        editingId = id;
        document.getElementById('formTitle').textContent = '编辑配置';
        document.getElementById('cfgPreset').value = '';
        document.getElementById('cfgName').value = cfg.name || '';
        document.getElementById('cfgBaseUrl').value = cfg.base_url || '';
        document.getElementById('cfgApiKey').value = cfg.api_key || '';
        document.getElementById('cfgModel').value = cfg.model || '';
        document.getElementById('cfgModelSelect').style.display = 'none';
        document.getElementById('saveBtn').textContent = '💾 更新';
        document.getElementById('addForm').style.display = 'block';
        document.getElementById('cfgName').focus();
    });
}

function saveConfig() {
    var name = document.getElementById('cfgName').value.trim();
    var baseUrl = document.getElementById('cfgBaseUrl').value.trim();
    var apiKey = document.getElementById('cfgApiKey').value.trim();
    var model = document.getElementById('cfgModel').value.trim();
    if (!name || !baseUrl || !model) { showToast('名称、API地址、模型不能为空', 'error'); return; }

    if (editingId) {
        var body = { name: name, base_url: baseUrl, model: model };
        if (apiKey) body.api_key = apiKey;
        fetch('/api/llm-configs/' + editingId, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
        }).then(function(r){return r.json();}).then(function(data){
            if (data.ok) { showToast('配置已更新', 'success'); hideAddForm(); loadConfigs(); }
            else { showToast(data.error || '更新失败', 'error'); }
        });
    } else {
        fetch('/api/llm-configs', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, base_url: baseUrl, api_key: apiKey, model: model })
        }).then(function(r){return r.json();}).then(function(data){
            if (data.ok) { showToast('配置已添加', 'success'); hideAddForm(); loadConfigs(); }
            else { showToast(data.error || '添加失败', 'error'); }
        });
    }
}

function deleteConfig(id, name) {
    if (!confirm('确认删除配置：' + name + '？')) return;
    fetch('/api/llm-configs/' + id, { method: 'DELETE' })
        .then(function(r){return r.json();})
        .then(function(data){
            if (data.ok) { showToast('已删除', 'success'); loadConfigs(); }
            else { showToast(data.error || '删除失败', 'error'); }
        });
}

function testConfig() {
    var baseUrl = document.getElementById('cfgBaseUrl').value.trim();
    var apiKey = document.getElementById('cfgApiKey').value.trim();
    var model = document.getElementById('cfgModel').value.trim();
    if (!baseUrl || !model) { showToast('API地址和模型不能为空', 'error'); return; }
    showToast('测试中...', '');
    fetch('/api/llm-configs/test', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ base_url: baseUrl, api_key: apiKey, model: model })
    }).then(function(r){return r.json();}).then(function(data){
        if (data.ok) { showToast(data.message, 'success'); }
        else { showToast(data.message || '测试失败', 'error'); }
    });
}

function testConfigById(id) {
    showToast('测试中...', '');
    fetch('/api/llm-configs/test', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ config_id: id })
    }).then(function(r){return r.json();}).then(function(data){
        if (data.ok) { showToast(data.message, 'success'); }
        else { showToast(data.message || '测试失败', 'error'); }
    });
}

function fetchModels() {
    var baseUrl = document.getElementById('cfgBaseUrl').value.trim();
    var apiKey = document.getElementById('cfgApiKey').value.trim();
    if (!baseUrl) { showToast('请先填写API地址', 'error'); return; }
    if (!apiKey) { showToast('请先填写API Key', 'error'); return; }
    showToast('获取模型列表中...', '');
    fetch('/api/llm-models', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ base_url: baseUrl, api_key: apiKey })
    }).then(function(r){return r.json();}).then(function(data){
        if (data.ok && data.models.length > 0) {
            var sel = document.getElementById('cfgModelSelect');
            sel.innerHTML = '';
            data.models.forEach(function(m) {
                var opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                if (m === document.getElementById('cfgModel').value) opt.selected = true;
                sel.appendChild(opt);
            });
            sel.style.display = 'block';
            if (!document.getElementById('cfgModel').value) {
                document.getElementById('cfgModel').value = data.models[0];
            }
            showToast('获取到 ' + data.models.length + ' 个模型', 'success');
        } else {
            showToast(data.error || '获取失败，可手动输入', 'error');
        }
    }).catch(function(err) { showToast(err.message, 'error'); });
}

function toggleTheme() {
    var current = document.documentElement.getAttribute('data-theme');
    if (current === 'light') { document.documentElement.removeAttribute('data-theme'); document.getElementById('themeBtn').textContent = '🌙'; localStorage.setItem('theme', 'dark'); }
    else { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('themeBtn').textContent = '☀️'; localStorage.setItem('theme', 'light'); }
}

var savedTheme = localStorage.getItem('theme');
if (savedTheme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); document.getElementById('themeBtn').textContent = '☀️'; }

function loadTapiPresets() {
    fetch('/api/translate-api-presets').then(function(r){return r.json();}).then(function(presets){
        var sel = document.getElementById('tapiPreset');
        presets.forEach(function(p) {
            var opt = document.createElement('option');
            opt.value = JSON.stringify(p);
            opt.textContent = p.name;
            sel.appendChild(opt);
        });
    });
}

function onTapiPresetChange() {
    var sel = document.getElementById('tapiPreset');
    if (!sel.value) return;
    var p = JSON.parse(sel.value);
    document.getElementById('tapiName').value = p.name;
    // Update labels with preset-specific names
    var keyLabels = document.querySelectorAll('#tapiAddForm .form-group label');
    if (keyLabels.length >= 2) {
        keyLabels[0].innerHTML = p.key_name + ' <a id="tapiKeyLink" href="' + (p.key_url || '#') + '" target="_blank" style="font-size:12px;' + (p.key_url ? '' : 'display:none;') + '">获取 Key →</a>';
        keyLabels[1].textContent = p.secret_name;
    }
}

var tapiEditingId = null;

function loadTapiConfigs() {
    fetch('/api/translate-api-configs').then(function(r){return r.json();}).then(function(configs){
        var list = document.getElementById('tapiConfigList');
        list.innerHTML = '';
        if (configs.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无配置</div>';
            return;
        }
        configs.forEach(function(c) {
            var div = document.createElement('div');
            div.className = 'config-item';
            var keyInfo = c.has_key ? (c.api_key_masked || '***') : '未设置';
            var secretInfo = c.has_secret ? (c.secret_key_masked || '***') : '未设置';
            div.innerHTML = '<div class="config-info">' +
                '<div class="config-name">' + esc(c.name) + '</div>' +
                '<div class="config-meta">引擎: ' + esc(c.engine) + ' · Key: ' + keyInfo + ' · Secret: ' + secretInfo + '</div>' +
                '</div>' +
                '<div class="config-actions">' +
                '<button class="btn btn-secondary btn-sm" onclick="testTapiConfigById(\''+c.id+'\')">🔌测试</button>' +
                '<button class="btn btn-secondary btn-sm" onclick="editTapiConfig(\''+c.id+'\')">✏️编辑</button>' +
                '<button class="btn btn-secondary btn-sm" onclick="deleteTapiConfig(\''+c.id+'\',\''+esc(c.name)+'\')" style="color:var(--error);">🗑️删除</button>' +
                '</div>';
            list.appendChild(div);
        });
    });
}

function showTapiAddForm() {
    tapiEditingId = null;
    document.getElementById('tapiFormTitle').textContent = '添加翻译API';
    document.getElementById('tapiPreset').value = '';
    document.getElementById('tapiName').value = '';
    document.getElementById('tapiKey').value = '';
    document.getElementById('tapiSecret').value = '';
    document.getElementById('tapiSaveBtn').textContent = '💾 保存';
    document.getElementById('tapiAddForm').style.display = 'block';
}

function hideTapiAddForm() {
    document.getElementById('tapiAddForm').style.display = 'none';
    tapiEditingId = null;
}

function saveTapiConfig() {
    var name = document.getElementById('tapiName').value.trim();
    var preset = document.getElementById('tapiPreset').value;
    var engine = '';
    if (preset) { engine = JSON.parse(preset).engine; }
    var apiKey = document.getElementById('tapiKey').value.trim();
    var secretKey = document.getElementById('tapiSecret').value.trim();
    if (!name || !engine) { showToast('请选择服务商并填写名称', 'error'); return; }

    if (tapiEditingId) {
        var body = { name: name };
        if (apiKey) body.api_key = apiKey;
        if (secretKey) body.secret_key = secretKey;
        fetch('/api/translate-api-configs/' + tapiEditingId, {
            method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
        }).then(function(r){return r.json();}).then(function(data){
            if (data.ok) { showToast('配置已更新', 'success'); hideTapiAddForm(); loadTapiConfigs(); }
            else { showToast(data.error || '更新失败', 'error'); }
        });
    } else {
        fetch('/api/translate-api-configs', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name, engine: engine, api_key: apiKey, secret_key: secretKey })
        }).then(function(r){return r.json();}).then(function(data){
            if (data.ok) { showToast('配置已添加', 'success'); hideTapiAddForm(); loadTapiConfigs(); }
            else { showToast(data.error || '添加失败', 'error'); }
        });
    }
}

function deleteTapiConfig(id, name) {
    if (!confirm('确认删除：' + name + '？')) return;
    fetch('/api/translate-api-configs/' + id, { method: 'DELETE' })
        .then(function(r){return r.json();})
        .then(function(data){ if (data.ok) { showToast('已删除', 'success'); loadTapiConfigs(); } });
}

function editTapiConfig(id) {
    fetch('/api/translate-api-configs/' + id + '/full').then(function(r){return r.json();}).then(function(cfg){
        if (cfg.error) { showToast(cfg.error, 'error'); return; }
        tapiEditingId = id;
        document.getElementById('tapiFormTitle').textContent = '编辑翻译API';
        document.getElementById('tapiPreset').value = '';
        document.getElementById('tapiName').value = cfg.name || '';
        document.getElementById('tapiKey').value = cfg.api_key || '';
        document.getElementById('tapiSecret').value = cfg.secret_key || '';
        document.getElementById('tapiSaveBtn').textContent = '💾 更新';
        document.getElementById('tapiAddForm').style.display = 'block';
        document.getElementById('tapiName').focus();
    });
}

function testTapiConfig() {
    var preset = document.getElementById('tapiPreset').value;
    if (!preset) { showToast('请先选择服务商', 'error'); return; }
    var p = JSON.parse(preset);
    var apiKey = document.getElementById('tapiKey').value.trim();
    var secretKey = document.getElementById('tapiSecret').value.trim();
    if (!apiKey || !secretKey) { showToast('请填写Key和密钥', 'error'); return; }
    showToast('测试中...', '');
    fetch('/api/translate-api-configs/test', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ engine: p.engine, api_key: apiKey, secret_key: secretKey })
    }).then(function(r){return r.json();}).then(function(data){
        if (data.ok) { showToast(data.message, 'success'); }
        else { showToast(data.message || '测试失败', 'error'); }
    });
}
